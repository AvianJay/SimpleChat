<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleChat - 首頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .home-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 500px;
            width: 90%;
        }

        .home-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--primary);
        }

        .home-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .home-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-app);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>

<body>
    <div class="app-background"></div>
    <div class="home-container">
        <h1 class="home-title">歡迎來到 SimpleChat</h1>
        <p class="home-subtitle">一個簡單、快速且現代化的即時聊天應用程式。<br>立即開始與朋友聯繫！</p>
        <div class="home-actions">
            <a href="/login" class="btn btn-primary">登入</a>
            <a href="/register" class="btn btn-secondary">註冊</a>
        </div>
    </div>
</body>

</html>
