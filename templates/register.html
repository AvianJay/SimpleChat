<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - SimpleChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/user.js') }}" defer></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>
    <div class="app-background"></div>
    <div class="auth-container">
        <h2 class="auth-title">註冊帳號</h2>
        <form id="register_form" onsubmit="event.preventDefault(); register();">
            <div class="form-group">
                <input type="email" id="email" name="email" class="form-input" placeholder="電子郵件" required>
            </div>
            <div class="form-group">
                <input type="text" id="username" name="username" class="form-input" placeholder="帳號" required
                    minlength="3" maxlength="20">
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" class="form-input" placeholder="密碼" required
                    minlength="8">
            </div>
            <div class="form-group">
                <input type="password" id="reconfirmpassword" name="reconfirm_password" class="form-input"
                    placeholder="再次輸入密碼" required minlength="8">
            </div>
            <button id="register-button" type="submit" class="auth-button">註冊</button>
        </form>
        <div class="auth-footer">
            <p>已經有帳號了嗎？ <a href="/login">立即登入</a></p>
        </div>
    </div>
</body>

</html>
