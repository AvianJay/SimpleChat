<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}?v=1">
    <script src="{{ url_for('static', filename='js/socket.io.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}?v=1" defer></script>
    <script src="{{ url_for('static', filename='js/user.js') }}?v=1" defer></script>
</head>

<body>
    <div class="app-background"></div>
    <div id="toast-container"></div>
    <div class="chat-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>訊息</h2>
                <div class="user-status">

                    <span id="welcome-message"></span>
                    <button id="logout-button" onclick="logout()" title="登出">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="status-indicators">
                <div id="error-message" class="error-message"></div>
                <div id="loading" class="loading">載入中...</div>
            </div>

            <div class="chats-list-container">
                <button id="add-friend-btn" title="新增好友">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </button>
                <button id="friend-requests-btn" title="好友邀請">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </button>
                <ul id="chat-list">
                    <!-- 聊天列表將由JavaScript動態生成 -->
                </ul>
            </div>
        </aside>

        <main class="chat-window">
            <header class="chat-header">
                <button id="mobile-back-btn" class="mobile-back-btn" title="返回列表">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <div class="chat-info">
                    <h3 id="chat-name">選擇聊天</h3>
                    <span class="status-dot"></span>
                </div>
            </header>

            <div id="messages" class="messages">
                <div class="empty-state">
                    <p>選擇一個對話開始聊天</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" rows="1" placeholder="輸入訊息..." disabled></textarea>
                    <button id="send-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Friend Modal -->
    <div id="add-friend-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>新增好友</h3>
            <div class="form-group">
                <input type="text" id="friend-id-input" placeholder="輸入好友 ID" class="form-input">
            </div>
            <button id="confirm-add-friend" class="btn-primary">發送邀請</button>
        </div>
    </div>

    <!-- Friend Requests Modal -->
    <div id="friend-requests-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>好友邀請</h3>
            <ul id="friend-requests-list">
                <!-- Requests will be loaded here -->
            </ul>
        </div>
    </div>
</body>

</html>
