<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=2">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toast.css') }}?v=1">
    <script src="{{ url_for('static', filename='js/socket.io.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/notifications.js') }}?v=1"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}?v=5" defer></script>
    <script src="{{ url_for('static', filename='js/user.js') }}?v=2" defer></script>
</head>

<body>
    <div class="app-background"></div>
    <button class="theme-toggle" type="button" data-theme-toggle>深色模式</button>
    <div id="toast-container"></div>
    <div id="chat-context-menu" class="context-menu" hidden></div>
    <div class="chat-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div>
                    <h2>聊天室</h2>
                    <div class="sidebar-subtitle">SimpleChat</div>
                </div>
                <div class="user-status">
                    <span id="welcome-message"></span>
                    <button id="logout-button" onclick="logout()" title="登出">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="status-indicators">
                <div id="error-message" class="error-message"></div>
                <div id="loading" class="loading">載入中...</div>
            </div>

            <div class="chats-list-container">
                <div class="sidebar-actions">
                    <button id="add-friend-btn" class="toolbar-button" title="新增好友">
                        <span>加好友</span>
                    </button>
                    <button id="friend-requests-btn" class="toolbar-button" title="好友邀請">
                        <span>邀請</span>
                    </button>
                    <button id="create-group-btn" class="toolbar-button" title="建立群組">
                        <span>群組</span>
                    </button>
                </div>
                <ul id="chat-list"></ul>
            </div>
        </aside>

        <main class="chat-window">
            <header class="chat-header">
                <div class="chat-header-left">
                    <button id="mobile-back-btn" class="mobile-back-btn" title="返回列表">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="chat-info">
                        <h3 id="chat-name">選擇聊天室</h3>
                        <span id="chat-meta">從左側選擇一位好友或群組開始聊天。</span>
                    </div>
                </div>
                <button id="group-actions-btn" class="toolbar-button secondary" hidden>管理群組</button>
            </header>

            <div id="messages" class="messages">
                <div class="empty-state">
                    <p>還沒有打開任何聊天室。</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" rows="1" placeholder="輸入訊息..." disabled></textarea>
                    <button id="send-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="add-friend-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>新增好友</h3>
            <div class="form-group">
                <input type="text" id="friend-username-input" placeholder="輸入好友 username，例如 alice.dev"
                    class="form-input">
            </div>
            <button id="confirm-add-friend" class="btn-primary">送出好友邀請</button>
        </div>
    </div>

    <div id="friend-requests-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>好友邀請</h3>
            <ul id="friend-requests-list"></ul>
        </div>
    </div>

    <div id="create-group-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3>建立群組</h3>
            <div class="form-group">
                <input type="text" id="group-name-input" placeholder="群組名稱" class="form-input">
            </div>
            <div class="form-group">
                <textarea id="group-description-input" rows="3" placeholder="群組描述（可選）"
                    class="form-input form-textarea"></textarea>
            </div>
            <button id="confirm-create-group" class="btn-primary">建立群組</button>
        </div>
    </div>

    <div id="group-members-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="group-manage-title">管理群組</h3>
            <div class="form-group inline-group">
                <input type="text" id="group-member-username-input" placeholder="輸入成員 username"
                    class="form-input">
                <button id="confirm-add-group-member" class="btn-primary inline-button">加入</button>
            </div>
            <ul id="group-members-list"></ul>
            <div class="modal-actions">
                <button id="leave-group-btn" class="btn-secondary">離開群組</button>
                <button id="delete-group-btn" class="btn-danger">刪除群組</button>
            </div>
        </div>
    </div>
</body>

</html>
